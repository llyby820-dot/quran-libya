name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      # 1. توليد مجلد أندرويد وملفاته المفقودة أولاً (ليتضمن AndroidManifest.xml تلقائياً)
      - name: Generate Android Platform Files
        run: flutter create --platforms=android --project-name quran_libya .

      # 2. جلب الحزم وتثبيت أداة الأيقونات
      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub add dev:flutter_launcher_icons

      # 3. إعداد وتوليد الأيقونة بشكل صحيح بعد توفر مجلد أندرويد
      - name: Generate App Icon
        run: |
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "ic_launcher.png"
            remove_alpha_ios: true
            min_sdk_android: 21
          EOF
          dart run flutter_launcher_icons

      # 4. بناء الـ APK النهائي
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 5. رفع ملف الـ APK الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-libya-app
          path: build/app/outputs/flutter-apk/app-release.apk
