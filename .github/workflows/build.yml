name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create --platforms=android --project-name quran_libya .

      - name: Setup Launcher Icons Configuration
        run: |
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "ic_launcher.png"
            adaptive_icon_background: "#0d3b2e"
            adaptive_icon_foreground: "ic_launcher.png"
            min_sdk_android: 21
          EOF

      - name: Install dependencies & Generate Scaled Icon
        run: |
          flutter pub get
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-libya-app
          path: build/app/outputs/flutter-apk/app-release.apk
