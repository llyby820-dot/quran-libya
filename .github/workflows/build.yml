name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Fresh Flutter Project Structure
        run: |
          # حفظ ملفاتنا الحالية مؤقتاً
          mkdir -p temp_src/lib
          cp -r lib/* temp_src/lib/
          cp pubspec.yaml temp_src/

          # إنشاء مشروع flutter جديد ومتوافق بالكامل مع أندرويد وGradle
          flutter create . --org com.quran.libya --project-name quran_awqaf_libya --platforms android

          # استعادة الكود الخاص بنا وملف pubspec
          rm -rf lib/*
          cp -r temp_src/lib/* lib/
          cp temp_src/pubspec.yaml pubspec.yaml

      - name: Download & Extract Assets from Release
        run: |
          echo "Downloading assets.zip..."
          curl -L -o assets.zip https://github.com/${{ github.repository }}/releases/download/v1.0.0/assets.zip
          echo "Extracting assets..."
          unzip -q assets.zip -d .
          ls -la assets/ | head -n 20

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
