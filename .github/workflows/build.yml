name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      # 1. ضمان وجود مجلدات الأصول لتجنب خطأ pubspec
      - name: Ensure Assets Exist
        run: |
          mkdir -p assets/pages

      # 2. إنشاء مشروع أندرويد مطابق لاسم الحزمة الأصلي
      - name: Create Android Platform
        run: flutter create --platforms=android --project-name quran_libya --org com.example .

      # 3. إعداد الأيقونة لتكون ملء الشاشة ومبرزة (بدون حواف فارغة)
      - name: Configure App Icon
        run: |
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "ic_launcher.png"
            remove_alpha_ios: true
            min_sdk_android: 21
          EOF

      # 4. تثبيت المكتبات وتوليد الأيقونة المباشرة
      - name: Install Dependencies & Generate Icons
        run: |
          flutter pub get
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons

      # 5. بناء الـ APK بدون هز الأيقونات ومعالجة الـ Release
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 6. رفع الملف النهائي
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-libya-app
          path: build/app/outputs/flutter-apk/app-release.apk
