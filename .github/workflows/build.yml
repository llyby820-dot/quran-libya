name: Build Quran APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter Base Project
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.quran.libya .
          cp ../main.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml

      - name: Install Dependencies
        run: |
          cd temp_app
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
