name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      # 1. تحميل وفك ملف assets.zip مباشرة من الـ Release الخاص بك بالطريقة الصحيحة
      - name: Download and Extract Quran Assets
        run: |
          echo "Downloading assets.zip..."
          curl -L -o assets.zip "https://github.com/llyby820/quran-libya/releases/download/v1.0.0/assets.zip"
          echo "Extracting assets..."
          unzip -q assets.zip
          ls -la assets/

      # 2. إنشاء هيكل أندرويد
      - name: Create Android Platform
        run: flutter create --platforms=android --project-name quran_libya .

      # 3. تثبيت أداة الأيقونات وتوليد الأيقونة المخصصة الواضحة
      - name: Generate App Icon
        run: |
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "ic_launcher.png"
            min_sdk_android: 21
          EOF
          flutter pub get
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons

      # 4. بناء الـ APK النهائي بحجمه الكامل وبدون تقليم الأصول
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 5. رفع الـ APK الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-libya-app
          path: build/app/outputs/flutter-apk/app-release.apk
