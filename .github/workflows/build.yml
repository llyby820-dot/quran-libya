name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      # 1. جلب الحزم الخاصة بمشروعك الأصلي كما هي دون إعادة إنشاء
      - name: Install Dependencies
        run: flutter pub get

      # 2. توليد الأيقونة ووضعها في مكانها الصحيح في أندرويد
      - name: Generate App Icon
        run: |
          cat <<EOF > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "ic_launcher.png"
            min_sdk_android: 21
          EOF
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons

      # 3. بناء ملف الـ APK الأصلي للمشروع بالكامل مع أصول المصحف كاملة
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 4. رفع الملف النهائي
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-libya-app
          path: build/app/outputs/flutter-apk/app-release.apk
